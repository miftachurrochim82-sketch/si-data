name: CI — Contract Check (CoreLib pin 17 + CDN v3.0.1)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check CoreLib pin 17
        run: |
          python3 -c "
          import json, sys
          data=json.load(open('src/appsscript.json'))
          ver=str(data['dependencies']['libraries'][0]['version'])
          print(f'pin={ver}')
          assert ver=='17', f'pin harus 17, ketemu {ver}'
          print('✅ pin 17 OK')
          "

      - name: Check CDN @v3.0.1 (1 CSS + 1 JS)
        run: |
          PIN="v3.0.1"
          grep -q "frontend-cdn@$PIN/frontend/app.min.css" src/Index.html \
            || (echo "❌ app.min.css tidak di-pin ke $PIN" && exit 1)
          grep -q "frontend-cdn@$PIN/frontend/app.min.js" src/Index.html \
            || (echo "❌ app.min.js tidak di-pin ke $PIN" && exit 1)
          # tidak boleh ada sisa berkas CDN lama (v3.0.0 menghapus 8 modul)
          if grep -qE "frontend/app-(core|components|modules|layout|ui|forms|data|charts|workflow|common)\.min\." src/Index.html; then
            echo "❌ masih memuat berkas CDN lama — v3 hanya app.min.css + app.min.js"
            exit 1
          fi
          # semua pin harus seragam
          PINS=$(grep -oE "frontend-cdn@v[0-9.]+" src/Index.html | sort -u | wc -l)
          [ "$PINS" = "1" ] || (echo "❌ pin CDN campur aduk" && exit 1)
          echo "✅ CDN $PIN — 1 CSS + 1 JS OK"

      - name: Check AppCore scope helper
        run: |
          grep -q "getMyScope" src/J_App.html || (echo "❌ getMyScope tidak ada" && exit 1)
          grep -q "setMyScope" src/J_App.html || (echo "❌ setMyScope tidak ada" && exit 1)
          echo "✅ scope helper OK"
