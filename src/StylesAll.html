<style>
  /* ══════════════════════════════════════════ */
  /* 1. RESET & BASE                            */
  /* ══════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ══════════════════════════════════════════ */
  /* 2. APP LAYOUT                              */
  /* ══════════════════════════════════════════ */
  .app-layout { display: flex; min-height: 100vh; width: 100%; }

  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
  }
  .sidebar-overlay.active { display: block; }

  /* ══════════════════════════════════════════ */
  /* 3. SIDEBAR                                 */
  /* ══════════════════════════════════════════ */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: linear-gradient(180deg, #1e3a5f 0%, #2d5a87 100%);
    color: white;
    display: flex; flex-direction: column;
    transition: width 0.25s ease;
    position: sticky; top: 0;
    height: 100vh;
    overflow-y: auto; overflow-x: hidden;
    z-index: 100;
  }
  .sidebar.collapsed { width: 64px; }

  .sidebar-header {
    padding: 18px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    gap: 8px; min-height: 68px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .brand-logo { font-size: 26px; flex-shrink: 0; }
  .brand-text { min-width: 0; overflow: hidden; white-space: nowrap; }
  .brand-text h2 { font-size: 15px; font-weight: 700; line-height: 1.2; }
  .brand-text p { font-size: 10px; opacity: 0.75; margin-top: 2px; }

  .sidebar-collapse-btn {
    background: rgba(255,255,255,0.1);
    border: none; color: white;
    width: 28px; height: 28px; border-radius: 6px;
    cursor: pointer; font-size: 11px;
    flex-shrink: 0; transition: all 0.2s;
  }
  .sidebar-collapse-btn:hover { background: rgba(255,255,255,0.25); }
  .sidebar.collapsed .sidebar-collapse-btn { transform: rotate(180deg); }
  .sidebar.collapsed .brand-text { display: none; }
  .sidebar.collapsed .sidebar-header { padding: 18px 10px; justify-content: center; }
  .sidebar.collapsed .brand-logo { display: none; }

  .sidebar-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 3px; }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    background: transparent; border: none;
    color: rgba(255,255,255,0.8);
    cursor: pointer; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    text-align: left; transition: all 0.15s;
    width: 100%; white-space: nowrap;
    font-family: inherit;
  }
  .nav-item:hover { background: rgba(255,255,255,0.12); color: white; }
  .nav-item.active {
    background: rgba(255,255,255,0.2); color: white;
    box-shadow: inset 3px 0 0 #fbbf24;
  }
  .nav-icon { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }

  .nav-section-label {
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    padding: 12px 14px 6px;
    text-transform: uppercase;
  }
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .nav-section-label { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 11px 8px; }
  .nav-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 10px 6px; }

  .sidebar-footer { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.1); }
  .sidebar-footer-info {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    color: rgba(255,255,255,0.7);
    font-size: 12px; font-weight: 600;
  }
  .sidebar.collapsed .sidebar-footer-info { justify-content: center; padding: 10px 8px; }

  .sidebar-install-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    background: rgba(251, 191, 36, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; width: 100%;
    margin-bottom: 8px;
    font-family: inherit;
    transition: all 0.15s;
    animation: pulseInstall 2s infinite;
  }
  .sidebar-install-btn:hover { background: rgba(251, 191, 36, 0.25); transform: translateY(-1px); }
  @keyframes pulseInstall {
    0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
  }
  .sidebar.collapsed .sidebar-install-btn { justify-content: center; padding: 11px 8px; }

  /* ══════════════════════════════════════════ */
  /* 4. MAIN CONTENT & HEADER                   */
  /* ══════════════════════════════════════════ */
  .main-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    transition: all 0.25s ease;
  }

  .header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    position: sticky; top: 0;
    z-index: 50;
    flex-wrap: wrap;
    min-height: 62px;
  }
  .mobile-menu-btn {
    display: none;
    background: #f1f5f9; border: none;
    padding: 8px 12px; border-radius: 8px;
    font-size: 18px; cursor: pointer;
    color: #1e3a5f;
  }
  .header-title { flex: 1; min-width: 0; }
  .header-title h1 { font-size: 18px; font-weight: 700; color: #1e3a5f; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .header-date { font-size: 12px; color: #6b7280; }

  .header .filter-select {
    background: white; color: #1e3a5f;
    border: 1px solid #d1d5db;
    padding: 8px 12px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
    outline: none; min-width: 130px;
    font-family: inherit;
  }
  .header .filter-select:hover { border-color: #2d5a87; }
  .header .filter-select:focus {
    border-color: #2d5a87;
    box-shadow: 0 0 0 3px rgba(45,90,135,0.1);
  }

  .btn-reset {
    padding: 8px 12px;
    background: #f1f5f9; color: #1e3a5f;
    border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px;
    cursor: pointer; font-weight: 700;
    transition: all 0.15s;
  }
  .btn-reset:hover { background: #e2e8f0; transform: rotate(-30deg); }

  /* ══════════════════════════════════════════ */
  /* 5. PAGE                                    */
  /* ══════════════════════════════════════════ */
  .page {
    display: none;
    padding: 20px 32px 32px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }
  .page.active { display: block; animation: fadeIn 0.2s ease-in; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .page-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
  }
  .page-header h2 { font-size: 20px; color: #1e3a5f; font-weight: 700; }

  /* ══════════════════════════════════════════ */
  /* 6. KPI                                     */
  /* ══════════════════════════════════════════ */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 16px;
  }
  .kpi-card {
    background: white; border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
    transition: transform 0.2s;
    border-left: 4px solid #2d5a87;
  }
  .kpi-card:hover { transform: translateY(-3px); }
  .kpi-icon { font-size: 24px; margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 800; color: #1e3a5f; }
  .kpi-label {
    font-size: 11px; color: #6b7280;
    margin-top: 4px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ══════════════════════════════════════════ */
  /* 7. CHART                                   */
  /* ══════════════════════════════════════════ */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px; margin-bottom: 16px;
  }
  .chart-grid-2-1 {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 16px; margin-bottom: 16px;
  }
  .chart-card {
    background: white; border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .chart-card.full-width { grid-column: 1 / -1; }
  .chart-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
  }
  .chart-card h3 { font-size: 13px; color: #374151; font-weight: 600; }
  .badge {
    font-size: 10px; padding: 3px 8px;
    background: #eff6ff; color: #1e40af;
    border-radius: 6px; font-weight: 600;
    text-transform: uppercase;
  }
  .chart-card canvas { max-height: 300px; }

  /* ══════════════════════════════════════════ */
  /* 8. TABLE                                   */
  /* ══════════════════════════════════════════ */
  .table-card {
    background: white; border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin: 0 auto 32px;
    max-width: 1400px;
  }
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td {
    padding: 9px 12px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
  }
  th {
    background: #f8fafc;
    font-weight: 600;
    color: #374151;
    position: sticky; top: 0;
  }
  td strong { color: #1e3a5f; }
  tbody tr:nth-child(even) td { background: #fafbfc; }
  tbody tr:hover td { background: #eff6ff !important; }
  .loading { text-align: center; color: #9ca3af; padding: 40px 0; }

  .table-wrapper::-webkit-scrollbar { height: 8px; }
  .table-wrapper::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
  .table-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .table-wrapper::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* ══════════════════════════════════════════ */
  /* 9. BUTTONS                                 */
  /* ══════════════════════════════════════════ */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn {
    padding: 7px 14px; border: none;
    border-radius: 7px;
    background: #2d5a87; color: white;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #1e3a5f; transform: translateY(-1px); }
  .btn-secondary { background: #6b7280; }
  .btn-secondary:hover { background: #4b5563; }

  .btn-icon {
    background: #f1f5f9; border: none;
    padding: 5px 8px; border-radius: 6px;
    cursor: pointer; font-size: 13px;
    margin-right: 3px; transition: all 0.15s;
  }
  .btn-icon:hover { background: #e2e8f0; }
  .btn-icon-danger { background: #fee2e2; }
  .btn-icon-danger:hover { background: #fecaca; }

  .btn-reset-filter {
    padding: 9px 12px;
    background: #f1f5f9; color: #64748b;
    border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px;
    cursor: pointer; font-weight: 700;
    transition: all 0.15s;
  }
  .btn-reset-filter:hover {
    background: #fee2e2; color: #dc2626;
    transform: rotate(-30deg);
  }

  /* ══════════════════════════════════════════ */
  /* 10. FILTER BAR                             */
  /* ══════════════════════════════════════════ */
  .filter-bar {
    display: flex; gap: 10px;
    margin-bottom: 14px; flex-wrap: wrap;
    padding: 12px 16px;
    background: white; border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    align-items: center;
  }
  .filter-input {
    flex: 1; min-width: 220px;
    padding: 9px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px; outline: none;
    font-family: inherit;
  }
  .filter-input:focus {
    border-color: #2d5a87;
    box-shadow: 0 0 0 3px rgba(45,90,135,0.1);
  }
  .filter-control {
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px; background: white;
    outline: none; cursor: pointer;
    min-width: 160px; font-family: inherit;
  }
  .filter-control:focus {
    border-color: #2d5a87;
    box-shadow: 0 0 0 3px rgba(45,90,135,0.1);
  }
  .filter-label {
    font-size: 13px; font-weight: 600;
    color: #374151; padding: 0 4px;
  }
  .vs-label {
    font-size: 14px; font-weight: 800;
    color: #94a3b8; padding: 0 4px;
  }
  input[type="date"].filter-control { min-width: 145px; }

  /* ══════════════════════════════════════════ */
  /* 11. PAGINATION                             */
  /* ══════════════════════════════════════════ */
  .pagination-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 4px 4px;
    margin-top: 12px;
    border-top: 1px solid #e5e7eb;
    flex-wrap: wrap; gap: 10px;
  }
  .pagination-info { font-size: 12px; color: #6b7280; }
  .pagination-info strong { color: #1e3a5f; }
  .pagination-controls { display: flex; align-items: center; gap: 4px; }
  .page-btn {
    min-width: 32px; height: 32px;
    padding: 0 8px;
    background: white; border: 1px solid #e5e7eb;
    border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600;
    color: #374151; transition: all 0.15s;
    font-family: inherit;
  }
  .page-btn:hover:not(:disabled) {
    background: #eff6ff;
    border-color: #2d5a87;
    color: #2d5a87;
  }
  .page-btn.active { background: #2d5a87; color: white; border-color: #2d5a87; }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-ellipsis { padding: 0 4px; color: #9ca3af; font-weight: 700; }
  .page-size-select {
    padding: 6px 8px;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    font-size: 12px; background: white;
    cursor: pointer; outline: none;
    margin-right: 8px; font-family: inherit;
  }
  .page-size-select:hover { border-color: #2d5a87; }

  /* ══════════════════════════════════════════ */
  /* 12. MODAL                                  */
  /* ══════════════════════════════════════════ */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center; align-items: flex-start;
    padding: 40px 20px; overflow-y: auto;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: white; border-radius: 14px;
    width: 100%; max-width: 720px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.25s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid #e5e7eb;
  }
  .modal-header h3 { font-size: 16px; color: #1e3a5f; }
  .modal-close {
    background: none; border: none;
    font-size: 20px; color: #6b7280;
    cursor: pointer; padding: 4px 8px;
    border-radius: 6px;
  }
  .modal-close:hover { background: #f3f4f6; }
  .modal-body { padding: 20px 24px; max-height: 65vh; overflow-y: auto; }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 14px 24px;
    border-top: 1px solid #e5e7eb;
  }

  /* ══════════════════════════════════════════ */
  /* 13. FORM                                   */
  /* ══════════════════════════════════════════ */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full-width { grid-column: 1 / -1; }
  .form-group label { font-size: 12px; font-weight: 600; color: #374151; }
  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px; font-family: inherit;
    outline: none; background: white;
    width: 100%; box-sizing: border-box;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: #2d5a87;
    box-shadow: 0 0 0 3px rgba(45,90,135,0.1);
  }
  .form-group select:disabled {
    background: #f9fafb; color: #9ca3af;
    cursor: not-allowed;
  }
  .form-error {
    display: none;
    margin-top: 12px; padding: 10px 14px;
    background: #fef2f2; border: 1px solid #fecaca;
    color: #b91c1c; border-radius: 8px;
    font-size: 13px;
  }
  .form-error.show { display: block; }

  /* ══════════════════════════════════════════ */
  /* 14. STATUS BADGE                           */
  /* ══════════════════════════════════════════ */
  .status-badge {
    display: inline-block; padding: 3px 8px;
    border-radius: 6px; font-size: 10px; font-weight: 700;
  }
  .status-SELESAI  { background: #d1fae5; color: #065f46; }
  .status-DRAFT    { background: #fef3c7; color: #92400e; }
  .status-PROSES   { background: #dbeafe; color: #1e40af; }

  /* ══════════════════════════════════════════ */
  /* 15. TOAST                                  */
  /* ══════════════════════════════════════════ */
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: #16a34a; color: white;
    padding: 12px 20px; border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    font-size: 13px; font-weight: 600;
    opacity: 0; transform: translateY(-10px);
    transition: all 0.3s;
    z-index: 2000;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: #dc2626; }

  /* ══════════════════════════════════════════ */
  /* 16. SECTION DIVIDER                        */
  /* ══════════════════════════════════════════ */
  .section-divider {
    margin: 28px 0 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid #e5e7eb;
    display: flex; align-items: center; gap: 10px;
  }
  .section-divider h3 {
    font-size: 16px;
    color: #1e3a5f;
    font-weight: 700;
    margin: 0;
  }

  /* ══════════════════════════════════════════ */
  /* 17. CROSS-TAB PANEL                        */
  /* ══════════════════════════════════════════ */
  .cross-tab-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  .cross-tab-grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  .cross-tab-panel {
    border: 1px solid #e5e7eb;
    border-left: 4px solid #2d5a87;
    border-radius: 10px;
    padding: 14px 16px;
    background: #fafbfc;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    box-sizing: border-box;
  }

  .cross-tab-panel-title {
    font-size: 13px;
    color: #1e3a5f;
    font-weight: 700;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #2d5a87;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: normal;
    word-break: break-word;
    line-height: 1.3;
  }

  /* Wrapper untuk scroll horizontal */
  .cross-tab-panel .table-wrapper {
    overflow-x: auto;
    overflow-y: hidden;
    max-width: 100%;
    -webkit-overflow-scrolling: touch;
  }

  .cross-tab-panel table {
    width: 100%;
    min-width: 100%;
    border-collapse: collapse;
    font-size: 10px;
    background: white;
  }

  .cross-tab-panel table th {
    background: #f1f5f9;
    font-weight: 700;
    font-size: 9px;
    white-space: normal !important;
    word-break: break-word;
    line-height: 1.15;
    padding: 6px 3px;
    text-align: center;
    vertical-align: middle;
    height: auto;
    color: #374151;
  }

  .cross-tab-panel table td {
    text-align: center;
    padding: 6px 3px;
    font-size: 10px;
    white-space: nowrap;
    color: #374151;
  }

  .cross-tab-panel table th:first-child,
  .cross-tab-panel table td:first-child {
    width: 75px;
    min-width: 75px;
    text-align: left;
    padding-left: 8px;
    position: sticky;
    left: 0;
    background: #f8fafc;
    z-index: 2;
  }

  .cross-tab-panel table th:last-child,
  .cross-tab-panel table td:last-child {
    width: 50px;
    min-width: 50px;
  }

  .cross-tab-panel table tr:last-child td {
    font-weight: 700;
    background: #f8fafc;
    border-top: 2px solid #1e3a5f;
  }

  /* Scrollbar halus untuk cross-tab */
  .cross-tab-panel .table-wrapper::-webkit-scrollbar {
    height: 6px;
  }
  .cross-tab-panel .table-wrapper::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 3px;
  }
  .cross-tab-panel .table-wrapper::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }

  #crossTabTitle {
    font-size: 15px !important;
    color: #1e3a5f;
    font-weight: 700;
  }

  #tabelCrossTab {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }
  #tabelCrossTab table thead th {
    background: #f1f5f9;
    font-weight: 700;
    font-size: 11px;
  }
  #tabelCrossTab tbody tr:last-child td {
    font-size: 12px;
    padding-top: 12px;
    padding-bottom: 12px;
  }

  @media (max-width: 900px) {
    .cross-tab-grid-2col { grid-template-columns: 1fr; }
  }

  /* ══════════════════════════════════════════ */
  /* 18. ANALISA & EVALUASI                     */
  /* ══════════════════════════════════════════ */
  .analisa-summary {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .summary-card {
    background: white; border-radius: 12px;
    padding: 20px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
    min-width: 180px; flex: 1; max-width: 260px;
    border-left: 4px solid #94a3b8;
  }
  .summary-card.summary-diff { border-left-color: #2d5a87; background: #f8fafc; }
  .summary-label {
    font-size: 12px; color: #6b7280;
    margin-bottom: 6px; font-weight: 600;
    text-transform: uppercase;
  }
  .summary-value { font-size: 32px; font-weight: 800; color: #1e3a5f; line-height: 1.1; }
  .summary-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .summary-arrow { font-size: 36px; color: #cbd5e1; }

  .status-summary { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .status-pill {
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 600;
    flex: 1; text-align: center; min-width: 120px;
  }
  .status-pill.status-naik { background: #dcfce7; color: #166534; }
  .status-pill.status-turun { background: #fee2e2; color: #991b1b; }
  .status-pill.status-stabil { background: #f1f5f9; color: #475569; }
  .status-pill.status-tercapai { background: #dcfce7; color: #166534; }
  .status-pill.status-sedang  { background: #fef3c7; color: #92400e; }
  .status-pill.status-kurang  { background: #fee2e2; color: #991b1b; }

  .table-analisa tr.row-naik td { background: rgba(220, 252, 231, 0.3); }
  .table-analisa tr.row-turun td { background: rgba(254, 226, 226, 0.3); }
  .table-analisa tr.row-naik:hover td { background: rgba(220, 252, 231, 0.6) !important; }
  .table-analisa tr.row-turun:hover td { background: rgba(254, 226, 226, 0.6) !important; }

  .eval-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 16px;
  }
  .eval-card {
    background: white; border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
    border-left: 4px solid #2d5a87;
  }
  .eval-icon { font-size: 24px; margin-bottom: 6px; }
  .eval-value { font-size: 24px; font-weight: 800; color: #1e3a5f; }
  .eval-label {
    font-size: 11px; color: #6b7280; margin-top: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .table-eval tr.row-naik td { background: rgba(220, 252, 231, 0.3); }
  .table-eval tr.row-turun td { background: rgba(254, 226, 226, 0.3); }
  .table-eval tr.row-sedang td { background: rgba(254, 243, 199, 0.3); }

  /* ══════════════════════════════════════════ */
  /* 19. AUDIT                                  */
  /* ══════════════════════════════════════════ */
  .audit-aksi {
    display: inline-block; padding: 3px 8px;
    border-radius: 6px; font-size: 10px;
    font-weight: 700; letter-spacing: 0.3px;
  }
  .audit-create { background: #dcfce7; color: #166534; }
  .audit-update { background: #dbeafe; color: #1e40af; }
  .audit-delete { background: #fee2e2; color: #991b1b; }
  .audit-upload { background: #fef3c7; color: #92400e; }
  .audit-init   { background: #f1f5f9; color: #475569; }
  .audit-unknown { background: #f1f5f9; color: #475569; }

  #tabelAudit table { font-size: 12px; }
  #tabelAudit table td {
    vertical-align: top;
    word-break: break-word;
    white-space: normal;
    max-width: 280px;
  }
  #tabelAudit table code { white-space: nowrap; }

  /* ══════════════════════════════════════════ */
  /* 20. UPLOAD                                 */
  /* ══════════════════════════════════════════ */
  .file-drop-zone {
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    padding: 20px; background: #f8fafc;
    text-align: center;
    transition: all 0.15s;
    cursor: pointer; position: relative;
  }
  .file-drop-zone:hover { border-color: #2d5a87; background: #eff6ff; }
  .file-drop-content {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; cursor: pointer;
  }
  .file-drop-icon { font-size: 32px; }
  .file-drop-text { text-align: left; font-size: 13px; color: #374151; }
  .file-drop-text strong { color: #2d5a87; }
  .file-info {
    margin-top: 10px; padding: 10px 14px;
    background: white; border-radius: 8px;
    border: 1px solid #e5e7eb;
    font-size: 12px; text-align: left;
  }
  .upload-progress {
    margin-top: 14px; height: 6px;
    background: #e5e7eb; border-radius: 3px;
    overflow: hidden;
  }
  .upload-progress-bar {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #2d5a87, #27ae60);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  /* ══════════════════════════════════════════ */
  /* 21. LEADERBOARD                            */
  /* ══════════════════════════════════════════ */
  .leaderboard-container {
    max-height: 320px;
    overflow-y: auto;
  }
  .leaderboard-list {
    display: flex; flex-direction: column; gap: 8px;
  }
  .leaderboard-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: #f8fafc; border-radius: 8px;
    border-left: 3px solid #cbd5e1;
    transition: all 0.15s;
  }
  .leaderboard-item:hover {
    background: #eff6ff;
    transform: translateX(2px);
  }
  .leaderboard-item.leaderboard-top {
    background: linear-gradient(90deg, #fef3c7 0%, #f8fafc 60%);
    border-left-color: #f59e0b;
  }
  .leaderboard-rank {
    font-size: 20px; font-weight: 800;
    color: #64748b; min-width: 32px;
    text-align: center; flex-shrink: 0;
  }
  .leaderboard-top .leaderboard-rank { font-size: 24px; }
  .leaderboard-content { flex: 1; min-width: 0; }
  .leaderboard-name {
    font-size: 12px; font-weight: 600;
    color: #1e3a5f; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .leaderboard-bar-wrapper {
    height: 6px; background: #e5e7eb;
    border-radius: 3px; overflow: hidden;
  }
  .leaderboard-bar {
    height: 100%;
    background: linear-gradient(90deg, #2d5a87, #27ae60);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .leaderboard-stats {
    text-align: right; flex-shrink: 0;
    min-width: 48px;
  }
  .leaderboard-value {
    font-size: 16px; font-weight: 800;
    color: #1e3a5f; line-height: 1;
  }
  .leaderboard-pct {
    font-size: 10px; color: #6b7280;
    margin-top: 2px;
  }

  /* ══════════════════════════════════════════ */
  /* 22. HEATMAP                                */
  /* ══════════════════════════════════════════ */
  .heatmap-container {
    overflow-x: auto;
    padding: 4px;
  }
  .heatmap-wrapper { overflow-x: auto; }
  .heatmap-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 3px;
    font-size: 11px;
    background: white;
  }
  .heatmap-table th,
  .heatmap-table td {
    padding: 8px 10px;
    text-align: center;
    border: none;
    white-space: nowrap;
    font-weight: 600;
  }
  .heatmap-table thead th {
    background: #f1f5f9;
    color: #374151;
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    position: static;
  }
  .heatmap-corner {
    text-align: left !important;
    min-width: 160px;
    background: #e2e8f0 !important;
  }
  .heatmap-label {
    text-align: left !important;
    min-width: 160px;
    max-width: 200px;
    background: #f8fafc;
    border-radius: 4px;
    font-weight: 600;
    color: #1e3a5f;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding-left: 10px !important;
  }
  .heatmap-cell {
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.15s;
    min-width: 32px;
    font-weight: 700;
  }
  .heatmap-cell:hover {
    transform: scale(1.08);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .heatmap-total {
    background: #e2e8f0 !important;
    color: #1e3a5f;
    border-radius: 4px;
    font-weight: 800;
    min-width: 40px;
  }
  .heatmap-total-row .heatmap-label {
    background: #1e3a5f !important;
    color: white !important;
  }
  .heatmap-total-row .heatmap-total { background: #cbd5e1 !important; }
  .heatmap-grand {
    background: #1e3a5f !important;
    color: white !important;
  }

  /* ══════════════════════════════════════════ */
  /* 23. FORM TEMATIK                           */
  /* ══════════════════════════════════════════ */
  .form-tematik-section {
    margin-top: 20px;
    padding: 16px;
    background: #f8fafc;
    border-radius: 10px;
    border-left: 4px solid #2d5a87;
  }
  .form-tematik-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #cbd5e1;
  }
  .form-tematik-icon { font-size: 18px; }
  .form-tematik-title {
    font-size: 14px; font-weight: 700;
    color: #1e3a5f; flex: 1;
  }
  .form-tematik-badge {
    font-size: 10px; padding: 3px 8px;
    background: #dbeafe; color: #1e40af;
    border-radius: 6px; font-weight: 700;
    text-transform: uppercase;
  }
  .form-tematik-body { margin-top: 4px; }
  .loading-tematik {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    padding: 12px;
    font-style: italic;
  }

  /* ══════════════════════════════════════════ */
  /* 24. DETAIL TEMATIK                         */
  /* ══════════════════════════════════════════ */
  .tematik-detail-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 8px;
  }
  .tematik-detail-item {
    padding: 8px 12px;
    background: white;
    border-radius: 6px;
    border-left: 3px solid #2d5a87;
  }
  .tematik-detail-label {
    font-size: 10px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .tematik-detail-value {
    font-size: 13px;
    color: #1e3a5f;
    font-weight: 600;
  }

  /* ══════════════════════════════════════════ */
  /* 25. TEMATIK PANELS                         */
  /* ══════════════════════════════════════════ */
  .tematik-panels-container {
    display: block;
    margin-bottom: 20px;
  }
  .tematik-panels-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .tematik-panel {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border-left: 4px solid #8e44ad;
    display: flex;
    flex-direction: column;
  }
  .tematik-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #8e44ad;
    flex-wrap: wrap;
  }
  .tematik-panel-title {
    font-size: 13px; font-weight: 700;
    color: #1e3a5f; flex: 1;
    min-width: 0; overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tematik-dim-select {
    padding: 6px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 11px;
    background: #f8fafc;
    cursor: pointer;
    outline: none;
    font-family: inherit;
    font-weight: 600;
    color: #8e44ad;
    max-width: 100%;
  }
  .tematik-dim-select:hover { border-color: #8e44ad; }
  .tematik-dim-select:focus {
    border-color: #8e44ad;
    box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.15);
  }
  .tematik-panel-body {
    overflow-x: auto;
    flex: 1;
  }
  .tematik-panel-body .loading-tematik {
    text-align: center;
    color: #9ca3af;
    font-size: 12px;
    padding: 20px;
    font-style: italic;
  }
  .tematik-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    background: white;
  }
  .tematik-table th,
  .tematik-table td {
    padding: 7px 8px;
    text-align: center;
    border-bottom: 1px solid #e5e7eb;
    white-space: nowrap;
  }
  .tematik-th-periode, .tematik-td-periode {
    text-align: left !important;
    min-width: 90px;
    background: #f8fafc;
    font-weight: 600;
    color: #1e3a5f;
  }
  .tematik-th-nilai {
    background: #f3e8ff;
    color: #6b21a8;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tematik-td-nilai { color: #374151; }
  .tematik-th-total, .tematik-td-total {
    background: #8e44ad !important;
    color: white !important;
    font-weight: 700;
  }
  .tematik-row-total td {
    background: #f8fafc;
    border-top: 2px solid #8e44ad;
  }
  .tematik-row-total .tematik-td-periode {
    background: #6b21a8 !important;
    color: white !important;
  }
  .tematik-row-total .tematik-td-nilai {
    background: #f3e8ff;
    color: #6b21a8;
  }
  .tematik-grand { background: #6b21a8 !important; }

  /* ══════════════════════════════════════════ */
  /* 26. FOOTER                                 */
  /* ══════════════════════════════════════════ */
  .footer {
    text-align: center; padding: 20px;
    font-size: 11px; color: #9ca3af;
  }

  /* ══════════════════════════════════════════ */
  /* 27. RESPONSIVE                             */
  /* ══════════════════════════════════════════ */
  @media (max-width: 900px) {
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      height: 100vh;
      transform: translateX(-100%);
      z-index: 200; width: 260px !important;
    }
    .sidebar.mobile-open {
      transform: translateX(0);
      box-shadow: 4px 0 20px rgba(0,0,0,0.3);
    }
    .sidebar.collapsed { width: 260px !important; }
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .brand-text,
    .sidebar.collapsed .nav-section-label { display: block; }
    .sidebar.collapsed .brand-logo { display: inline; }
    .sidebar.collapsed .nav-item { justify-content: flex-start; padding: 11px 14px; }
    .sidebar.collapsed .sidebar-header { padding: 18px 16px; justify-content: space-between; }
    .sidebar-collapse-btn { display: none; }

    .mobile-menu-btn { display: block; }
    .header { padding: 10px 16px; }
    .header-title h1 { font-size: 15px; }
    .header .filter-select { min-width: 100px; font-size: 12px; padding: 6px 8px; }
    .header-date { display: none; }
    .page { padding: 16px; }
    .chart-grid, .chart-grid-2-1 { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .kpi-value { font-size: 20px; }
    .kpi-icon { font-size: 20px; }
    .chart-card canvas { max-height: 240px; }
    .table-card { padding: 14px; margin: 0 0 16px; }
    .toolbar { width: 100%; }
    .toolbar .btn { flex: 1; }
    .filter-input { min-width: 100%; }
    .filter-control { flex: 1; min-width: 0; font-size: 12px; padding: 8px 10px; }
    .btn-reset-filter { padding: 8px 10px; }
    .pagination-bar { flex-direction: column; align-items: stretch; }
    .pagination-info { text-align: center; font-size: 11px; }
    .pagination-controls { justify-content: center; flex-wrap: wrap; }
    .page-btn { min-width: 30px; height: 30px; font-size: 11px; }
    .page-size-select { margin-right: 0; width: 100%; margin-bottom: 8px; }
    .form-grid { grid-template-columns: 1fr; }
    .modal { max-width: 100%; border-radius: 16px 16px 0 0; align-self: flex-end; }
    .modal-overlay { padding: 0; align-items: flex-end; }
    .modal-body { max-height: 70vh; }
    .analisa-summary { flex-direction: column; }
    .summary-card { max-width: 100%; width: 100%; }
    .summary-arrow { transform: rotate(90deg); }
    .status-summary { flex-direction: column; }
    .cross-tab-grid-2col { grid-template-columns: 1fr; }
    .tematik-panels-grid { grid-template-columns: 1fr; }
    .tematik-panel-header { flex-direction: column; align-items: stretch; }
    .tematik-dim-select { width: 100%; max-width: none; }
    .tematik-detail-grid { grid-template-columns: 1fr; }
    .form-tematik-section { padding: 12px; }
    .heatmap-table th, .heatmap-table td { padding: 6px 4px; font-size: 10px; }
    .heatmap-label, .heatmap-corner { min-width: 100px; }
    .leaderboard-name { font-size: 11px; }
    input, select, textarea { font-size: 16px !important; }
  }

  @media (max-width: 600px) {
    .header-right { width: 100%; }
    .header .filter-select { flex: 1; min-width: 0; }
  }

  /* ══════════════════════════════════════════ */
  /* 28. PRINT                                  */
  /* ══════════════════════════════════════════ */
  @media print {
    .header-right, .toolbar, .footer, .sidebar, .main-nav,
    .pagination-bar, .filter-bar { display: none !important; }
    body { background: white; }
    .chart-card, .table-card, .cross-tab-panel {
      box-shadow: none; border: 1px solid #e5e7eb;
    }
    .cross-tab-panel { break-inside: avoid; }
  }

  /* ============ TABS (Analisa) ============ */
  .tabs-nav {
    display: flex; gap: 6px; margin-bottom: 16px;
    border-bottom: 2px solid #e5e7eb;
    padding-bottom: 0;
  }
  .tab-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 18px;
    background: transparent; border: none;
    border-bottom: 3px solid transparent;
    font-size: 13px; font-weight: 700;
    color: #6b7280; cursor: pointer;
    transition: all 0.15s; font-family: inherit;
    margin-bottom: -2px;
  }
  .tab-btn:hover { color: #1e3a5f; background: #f8fafc; }
  .tab-btn.active { color: #1e3a5f; border-bottom-color: #2d5a87; background: #eff6ff; }
  .tab-icon { font-size: 14px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .audit-info-bar {
    padding: 8px 14px; background: #f8fafc;
    border-left: 4px solid #2d5a87; border-radius: 6px;
    font-size: 12px; color: #374151; margin-bottom: 12px;
  }

  /* ============ MODAL VARIANTS ============ */
  .modal-sm { max-width: 560px; }
  .modal-lg { max-width: 860px; }

  .mb-14 { margin-bottom: 14px; }
  .text-muted { color: #9ca3af; font-weight: 400; }
  .inline-flex-gap { display: flex; gap: 8px; }
  .flex-1 { flex: 1; }

  .peserta-temp-list {
    margin-top: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    min-height: 100px;
    padding: 10px;
  }
  .peserta-temp-list .loading { padding: 20px 0; text-align: center; }

  /* ============ PETA PAGE ============ */
  .peta-card { padding: 12px; overflow: visible; }
  .map-container {
    width: 100%; height: 600px;
    border-radius: 10px; overflow: hidden;
    background: #e5e7eb; position: relative; z-index: 1;
  }
  .peta-legend {
