<!-- ============================ -->
<!-- V_Analisa.html                -->
<!-- PAGE: ANALISA (3 TAB)         -->
<!-- ============================ -->
<section id="page-analisa" class="page">
  <div class="page-header">
    <h2>📈 Analisa</h2>
  </div>

  <!-- Tab Navigation -->
  <div class="tabs-nav">
    <button class="tab-btn active" data-tab="matrik" onclick="switchAnalisaTab('matrik')">
      <span class="tab-icon">📊</span> Matrik
    </button>
    <button class="tab-btn" data-tab="tematik" onclick="switchAnalisaTab('tematik')">
      <span class="tab-icon">🔬</span> Tematik
    </button>
    <button class="tab-btn" data-tab="perbandingan" onclick="switchAnalisaTab('perbandingan')">
      <span class="tab-icon">📈</span> Perbandingan
    </button>
  </div>

  <!-- TAB: MATRIK -->
  <div id="tab-matrik" class="tab-content active">
    <div class="filter-bar">
      <span class="filter-label">📌 Filter global berlaku otomatis</span>
      <button class="btn btn-secondary" onclick="reloadMatrik()" style="margin-left:auto;">🔄 Refresh</button>
      <button class="btn" onclick="exportCSV()">📥 Export CSV</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Print</button>
    </div>
    <div class="table-card" style="padding: 14px;">
      <h3 id="crossTabTitle" style="margin-bottom: 16px;">📊 Rekap Cross-Tab</h3>
      <div id="tabelCrossTab"><p class="loading">Memuat data...</p></div>
    </div>
  </div>

  <!-- TAB: TEMATIK -->
  <div id="tab-tematik" class="tab-content">
    <div class="filter-bar">
      <span class="filter-label">📌 Analisa tematik per dimensi</span>
      <button class="btn btn-secondary" onclick="reloadTematik()" style="margin-left:auto;">🔄 Refresh</button>
    </div>
    <div id="tematikPanels" class="tematik-panels-container">
      <p class="loading">Memuat data tematik...</p>
    </div>
  </div>

  <!-- TAB: PERBANDINGAN -->
  <div id="tab-perbandingan" class="tab-content">
    <div class="filter-bar">
      <label class="filter-label">Bandingkan:</label>
      <select id="anaPeriodeA" class="filter-control">
        <option value="">— Periode Awal —</option>
      </select>
      <span class="vs-label">vs</span>
      <select id="anaPeriodeB" class="filter-control">
        <option value="">— Periode Akhir —</option>
      </select>
      <button class="btn" onclick="loadAnalisa()">🔍 Bandingkan</button>
      <button class="btn btn-secondary" onclick="exportAnalisaCSV()">📥 Export</button>
    </div>
    <div id="analisaContent">
      <div class="table-card">
        <p class="loading" style="padding: 60px 0;">
          🔍 Pilih 2 periode di atas, lalu klik <strong>Bandingkan</strong>.
        </p>
      </div>
    </div>
  </div>
</section>

<!-- ============================ -->
<!-- PAGE: EVALUASI               -->
<!-- ============================ -->
<section id="page-evaluasi" class="page">
  <div class="page-header">
    <h2>🎯 Evaluasi Target vs Realisasi</h2>
    <div class="toolbar">
      <button class="btn btn-secondary" onclick="openFormTarget()">⚙️ Kelola Target</button>
    </div>
  </div>
  <div class="filter-bar">
    <label class="filter-label">Periode:</label>
    <select id="evalPeriode" class="filter-control">
      <option value="">— Semua Periode —</option>
    </select>
    <button class="btn" onclick="loadEvaluasi()">🔍 Tampilkan</button>
    <button class="btn btn-secondary" onclick="exportEvaluasiCSV()">📥 Export</button>
  </div>
  <div id="evalContent">
    <div class="table-card">
      <p class="loading" style="padding: 60px 0;">
        Pilih periode di atas, lalu klik <strong>Tampilkan</strong>.
      </p>
    </div>
  </div>
</section>
