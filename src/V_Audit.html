<!-- V_Audit.html                  -->
<!-- PAGE: AUDIT LOG               -->
<!-- ============================ -->
<section id="page-audit" class="page">
  <div class="page-header">
    <h2>📜 Audit Log</h2>
    <div class="toolbar">
      <button class="btn btn-secondary" onclick="cleanAuditConfirm()" title="Hapus log lebih dari 90 hari">🧹 Bersihkan Log Lama</button>
      <button class="btn btn-secondary" onclick="exportAuditCSV()">📥 Export CSV</button>
    </div>
  </div>
  <!-- Info bar -->
  <div class="audit-info-bar">
    <span>📌 <span id="auditTotalInfo">Memuat...</span></span>
  </div>
  <!-- Filter -->
  <div class="filter-bar">
    <input type="text" id="auditSearch" placeholder="🔍 Cari user / record / keterangan..." class="filter-input">
    <select id="auditUser" class="filter-control"><option value="">👤 Semua User</option></select>
    <select id="auditAksi" class="filter-control"><option value="">⚡ Semua Aksi</option></select>
    <select id="auditTabel" class="filter-control"><option value="">📋 Semua Tabel</option></select>
    <input type="date" id="auditDari" class="filter-control" title="Dari tanggal">
    <input type="date" id="auditSampai" class="filter-control" title="Sampai tanggal">
    <button class="btn-reset-filter" onclick="resetFilterAudit()" title="Reset">↺</button>
  </div>
  <!-- Tabel -->
  <div class="table-card">
    <div class="table-wrapper" id="tabelAudit"><p class="loading">Memuat data...</p></div>
    <div class="pagination-bar" id="paginationAudit"></div>
  </div>
</section>
