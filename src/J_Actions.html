<script>
// ============================================================
// STARTER-KIT - J_Actions.html (v2.11.0 — aksi 5M + T_UTAMA + RTL + FSM)
// ============================================================
// Handler aksi user — simpan/hapus/transisi/generate.
// Master: satu simpanMaster/hapusMaster generik (aksi per-tab).
// RTL: status HANYA via modal Ubah Status (state machine backend) —
//      field status tidak ada di form (standar UIUX v2).

window.StarterKitActions = {
  methods: {

    // ==================== T_UTAMA (hybrid tematik) ====================
    async simpanUtama() {
      // Validasi dasar
      if (!String(this.utamaForm.judul || '').trim() && !String(this.utamaForm.uraian || '').trim()) { this.showToast('Judul/Uraian wajib.', 'warning'); return; }
      // Jika fungsi_id terisi → pakai jalur tematik (09_Bridge)
      if (this.utamaForm.fungsi_id) {
        if (!this.utamaForm.unit_id || !this.utamaForm.kategori_id || !this.utamaForm.jenis_id || !this.utamaForm.periode_id || !this.utamaForm.lokasi_id) { this.showToast('Lengkapi Bidang/Seksi/Fungsi + Kategori/Jenis/Periode/Lokasi.', 'warning'); return; }
        this.utamaSaving = true;
        try {
          var atribut=[];
          for(var k in this.tematikValues){
            var v=this.tematikValues[k];
            if(v===undefined||v===''||v===null) continue;
            var dim=(this.tematikDimensiList||[]).find(function(d){return d.id===k;});
            if(!dim) continue;
            var atr={dimensi_id:k, nilai_id:'', nilai_text:'', nilai_number:0, nilai_date:'', keterangan:''};
            if(dim.jenis_input==='SELECT') atr.nilai_id=String(v);
            else if(dim.jenis_input==='TEXT') atr.nilai_text=String(v);
            else if(dim.jenis_input==='NUMBER'){ var n=Number(v); if(!n) continue; atr.nilai_number=n; }
            else if(dim.jenis_input==='DATE') atr.nilai_date=String(v);
            else atr.nilai_text=String(v);
            atribut.push(atr);
          }
          var payload={
            tanggal: this.utamaForm.tanggal || new Date().toISOString().slice(0,10),
            unit_id: this.utamaForm.unit_id,
            fungsi_id: this.utamaForm.fungsi_id,
            kategori_id: this.utamaForm.kategori_id,
            jenis_id: this.utamaForm.jenis_id,
            periode_id: this.utamaForm.periode_id,
            lokasi_id: this.utamaForm.lokasi_id,
            uraian: this.utamaForm.uraian || this.utamaForm.judul || this.utamaForm.deskripsi || '',
            jumlah: Number(this.utamaForm.jumlah)||0,
            satuan_id: this.utamaForm.satuan_id,
            anggaran: Number(this.utamaForm.anggaran)|| Number(this.utamaForm.nilai)||0,
            status: this.utamaForm.status || 'draft',
            keterangan: this.utamaForm.catatan || this.utamaForm.deskripsi || '',
            atribut: atribut
          };
          var fn = this.utamaForm.id ? 'updateKegiatan' : 'simpanKegiatan';
          if(this.utamaForm.id) payload.id=this.utamaForm.id;
          var res = await new Promise(function(resolve, reject){
            google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){ reject(e); })[fn](payload);
          });
          if (res && res.success) {
            this.showToast(this.utamaForm.id ? 'Kegiatan diperbarui.' : 'Kegiatan tersimpan: '+(res.kode||''), 'success');
            this.showUtamaForm = false;
            // reset tematik
            this.tematikDimensiList=[]; this.tematikValues={}; this.tematikBidangId=''; 
            this.loadUtama(this.utamaPagination.page);
          } else this.showToast((res && res.error) || 'Gagal simpan tematik', 'error');
        } catch (e) { this.showToast('Error simpan tematik: '+(e.message||e), 'error'); }
        finally { this.utamaSaving = false; }
        return;
      }
      // Fallback lama (tanpa tematik)
      if (!String(this.utamaForm.judul || '').trim()) { this.showToast('Judul wajib.', 'warning'); return; }
      this.utamaSaving = true;
      try {
        var res = await this.callServer('save_utama', { record: this.utamaForm });
        if (res && res.success) {
          this.showToast('T_UTAMA disimpan.', 'success');
          this.showUtamaForm = false;
          this.loadUtama(this.utamaPagination.page);
        } else this.showToast(res.error || 'Gagal simpan T_UTAMA', 'error');
      } catch (e) { this.showToast('Error simpan T_UTAMA', 'error'); }
      finally { this.utamaSaving = false; }
    },

    async hapusUtama(r) {
      if (!confirm('Hapus "' + (r.judul || r.kode) + '"?')) return;
      try {
        var res = await this.callServer('delete_utama', { id: r.id });
        if (res && res.success) { this.showToast('Dihapus.', 'success'); this.loadUtama(this.utamaPagination.page); }
        else this.showToast(res.error || 'Gagal hapus', 'error');
      } catch (e) { this.showToast('Error hapus', 'error'); }
    },

    // ==================== 5 MASTER (generik) ====================
    openMasterForm() {
      this.masterForm = {
        id: '', kode: '', nama: '', parent_id: '', deskripsi: '',
        kategori_id: '', periode: 'Fleksibel', tahun: String(new Date().getFullYear()), bulan: '',
        simbol: '', alamat: '', keterangan: '', urutan: 0, status_aktif: 'true'
      };
      this.showMasterForm = true;
    },

    openMasterEdit(r) {
      this.masterForm = Object.assign({
        id: '', kode: '', nama: '', parent_id: '', deskripsi: '',
        kategori_id: '', periode: 'Fleksibel', tahun: String(new Date().getFullYear()), bulan: '',
        simbol: '', alamat: '', keterangan: '', urutan: 0, status_aktif: 'true'
      }, r);
      this.showMasterForm = true;
    },

    async simpanMaster() {
      var tab = this.masterTab;
      var aksi = window.SK_MAPS.MASTER_AKSI[tab];
      if (!aksi) return;
      if (!String(this.masterForm.kode || '').trim() || !String(this.masterForm.nama || '').trim()) {
        if (tab !== 'periode') { this.showToast('Kode dan nama wajib.', 'warning'); return; }
      }
      if (tab === 'periode' && !/^\d{4}$/.test(String(this.masterForm.tahun || ''))) {
        this.showToast('Tahun wajib (4 digit).', 'warning'); return;
      }
      this.masterSaving = true;
      try {
        var res = await this.callServer(aksi.save, { record: this.masterForm });
        if (res && res.success) {
          this.showToast('Master ' + tab + ' disimpan.', 'success');
          this.showMasterForm = false;
          this.loadMasterSatelit(true);
        } else this.showToast(res.error || 'Gagal simpan master ' + tab, 'error');
      } catch (e) { this.showToast('Error simpan master', 'error'); }
      finally { this.masterSaving = false; }
    },

    async hapusMaster(r) {
      var tab = this.masterTab;
      var aksi = window.SK_MAPS.MASTER_AKSI[tab];
      if (!aksi) return;
      if (!confirm('Hapus "' + (r.nama || r.kode) + '"?')) return;
      try {
        var res = await this.callServer(aksi.del, { id: r.id });
        if (res && res.success) { this.showToast('Dihapus.', 'success'); this.loadMasterSatelit(true); }
        else this.showToast(res.error || 'Gagal hapus (masih dipakai?)', 'error');
      } catch (e) { this.showToast('Error hapus', 'error'); }
    },

    // ==================== RTL ====================
    async simpanRtl() {
      if (!String(this.rtlForm.judul_rtl || '').trim()) { this.showToast('Judul RTL wajib.', 'warning'); return; }
      this.rtlSaving = true;
      try {
        var res = await this.callServer('save_tindak_lanjut', { record: this.rtlForm });
        if (res && res.success) {
          this.showToast('RTL disimpan.', 'success');
          this.showRtlForm = false;
          this.loadRtl(this.rtlPage);
        } else this.showToast(res.error || 'Gagal simpan RTL', 'error');
      } catch (e) { this.showToast('Error simpan RTL', 'error'); }
      finally { this.rtlSaving = false; }
    },

    async hapusRtl(r) {
      if (!confirm('Hapus RTL "' + (r.judul_rtl || r.judul) + '"?')) return;
      try {
        var res = await this.callServer('delete_tindak_lanjut', { id: r.id });
        if (res && res.success) { this.showToast('RTL dihapus.', 'success'); this.loadRtl(this.rtlPage); }
        else this.showToast(res.error || 'Gagal hapus RTL', 'error');
      } catch (e) { this.showToast('Error hapus RTL', 'error'); }
    },

    openRtlEdit(r) {
      this.rtlForm = Object.assign({ id: '', sumber_evaluasi: 'manual', judul_rtl: '', deskripsi: '', assigned_to: '', due_date: '', status_rtl: 'baru', progress_pct: 0, dokumen_terkait: '', catatan: '' }, r);
      if (r.judul && !this.rtlForm.judul_rtl) this.rtlForm.judul_rtl = r.judul;
      this.showRtlForm = true;
    },

    openRtlStatus(r) {
      this.rtlStatusTarget = r;
      this.rtlStatusBaru = r.status_rtl || r.status || 'diproses';
      this.rtlStatusProgress = r.progress_pct || 0;
      this.rtlStatusCatatan = '';
      this.showRtlStatusForm = true;
    },

    async ubahStatusRtl() {
      this.rtlSaving = true;
      try {
        var res = await this.callServer('ubah_status_tindak_lanjut', { id: this.rtlStatusTarget.id, status_rtl: this.rtlStatusBaru, progress_pct: this.rtlStatusProgress, catatan: this.rtlStatusCatatan });
        if (res && res.success) {
          this.showToast('Status RTL diubah.', 'success');
          this.showRtlStatusForm = false;
          this.loadRtl(this.rtlPage);
        } else this.showToast(res.error || 'Gagal ubah status (cek transisi legal)', 'error');
      } catch (e) { this.showToast('Error ubah status', 'error'); }
      finally { this.rtlSaving = false; }
    }
  }
};
</script>
