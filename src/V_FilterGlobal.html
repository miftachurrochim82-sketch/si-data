<!-- ============================================================
     STARTER-KIT - V_FilterGlobal.html (Tahap 4 — Global Filter + Export)
     Filter Tahun/Bidang/Seksi + keyword — sinkron ke semua halaman
     Panduan: 1 baris sticky, collapsible, + tombol Terapkan/Reset/Export
     ============================================================ -->
<div class="px-4 sm:px-6 pt-3 shrink-0">
  <div class="card !p-0 overflow-hidden border-sky-100 dark:border-slate-700 shadow-sm">
    <!-- Bar header — selalu terlihat -->
    <div class="flex items-center gap-2 px-3 py-2 bg-gradient-to-r from-sky-50 to-white dark:from-slate-800 dark:to-slate-900 border-b border-slate-100 dark:border-slate-700">
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-sky-600 text-white text-xs"><i class="fa-solid fa-filter"></i></span>
        <div>
          <div class="text-xs font-black text-slate-800 dark:text-white leading-none flex items-center gap-1.5">
            Filter Global
            <span v-if="globalFilterActiveCount" class="inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-sky-600 text-white text-[10px] leading-none">{{ globalFilterActiveCount }}</span>
            <span v-if="filterGlobalApplied" class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded-full"><i class="fa-solid fa-check text-[8px]"></i> Aktif</span>
          </div>
          <div class="text-[11px] text-slate-400 dark:text-slate-500 leading-none mt-0.5">
            <span v-if="filterGlobal.tahun">{{ filterGlobal.tahun }}</span><span v-if="filterGlobal.tahun && globalFilterHasBidang"> · </span><span v-if="globalFilterHasBidang">{{ bidangNamaGlobal }}</span><span v-if="!filterGlobal.tahun && !globalFilterHasBidang">Semua tahun · Semua bidang</span>
          </div>
        </div>
      </div>
      <div class="ml-auto flex items-center gap-1.5">
        <button class="btn btn-ghost btn-sm !px-2 !py-1 text-xs" @click="filterGlobalCollapsed = !filterGlobalCollapsed" :title="filterGlobalCollapsed ? 'Buka filter' : 'Ciutkan'">
          <i :class="filterGlobalCollapsed ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up'"></i>
          <span class="hidden sm:inline ml-1">{{ filterGlobalCollapsed ? 'Buka' : 'Ciutkan' }}</span>
        </button>
        <button class="btn btn-ghost btn-sm !px-2 !py-1 text-xs" @click="resetGlobalFilter()" title="Reset">
          <i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline ml-1">Reset</span>
        </button>
        <button class="btn btn-primary btn-sm !px-3 !py-1 text-xs" @click="applyGlobalFilter()" :disabled="utamaLoading || petaLoading || lapLoading">
          <i class="fa-solid fa-check"></i> Terapkan
        </button>
      </div>
    </div>

    <!-- Form — collapsible -->
    <div v-show="!filterGlobalCollapsed" class="p-3 bg-white dark:bg-slate-900">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        <div>
          <label class="filter-label">Tahun</label>
          <select v-model="filterGlobal.tahun" class="select w-full">
            <option value="">Semua tahun</option>
            <option v-for="t in tahunOptions" :key="t" :value="t">{{ t }}</option>
          </select>
        </div>
        <div>
          <label class="filter-label">Bidang</label>
          <select v-model="filterGlobal.bidangId" @change="filterGlobal.seksiId=''" class="select w-full">
            <option value="">Semua bidang</option>
            <option v-for="b in bidangList" :key="b.id" :value="b.id">{{ b.nama }}</option>
          </select>
        </div>
        <div>
          <label class="filter-label">Seksi / Sub Bidang</label>
          <select v-model="filterGlobal.seksiId" class="select w-full" :disabled="!filterGlobal.bidangId">
            <option value="">Semua seksi</option>
            <option v-for="s in seksiListGlobal" :key="s.id" :value="s.id">{{ s.nama }}</option>
          </select>
        </div>
        <div>
          <label class="filter-label">Kata kunci</label>
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input v-model="filterGlobal.keyword" @keyup.enter="applyGlobalFilter()" type="text" placeholder="Cari uraian / kode..." class="input w-full !pl-7 !py-1.5 text-sm" />
          </div>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
        <span class="text-[11px] text-slate-400"><i class="fa-solid fa-circle-info"></i> Filter ini sinkron ke Dashboard, Transaksi, Laporan, Analisa, Evaluasi &amp; Peta.</span>
        <div class="ml-auto flex items-center gap-1.5">
          <button class="btn btn-ghost btn-sm text-xs" @click="exportGlobalCsv()" title="Export CSV halaman aktif">
            <i class="fa-solid fa-file-csv text-emerald-600"></i> Export CSV
          </button>
          <button class="btn btn-ghost btn-sm text-xs" @click="exportGlobalPrint()" title="Cetak / PDF">
            <i class="fa-solid fa-print"></i> Cetak
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
