<script>
// =============================================
// J_Analisa.html — Tab Controller + Perbandingan
// =============================================

// =============================================
// TAB CONTROLLER
// =============================================
let analisaCurrentTab = 'matrik';
let analisaChart = null;

function switchAnalisaTab(tab) {
  analisaCurrentTab = tab;
  document.querySelectorAll('#page-analisa .tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('#page-analisa .tab-content').forEach(c => {
    c.classList.remove('active');
  });
  const content = document.getElementById('tab-' + tab);
  if (content) content.classList.add('active');
  if (tab === 'matrik') loadCrossTabAnalisa();
  if (tab === 'tematik') loadTematikAnalisa();
  if (tab === 'perbandingan') initAnalisaPerbandingan();
}

function initAnalisaPage() {
  if (analisaCurrentTab === 'matrik') loadCrossTabAnalisa();
  else if (analisaCurrentTab === 'tematik') loadTematikAnalisa();
  else if (analisaCurrentTab === 'perbandingan') initAnalisaPerbandingan();
}

function reloadTematik() {
  loadTematikAnalisa();
  showToast('🔄 Tematik di-refresh');
}

function loadTematikAnalisa() {
  google.script.run
    .withSuccessHandler(renderTematikPanels)
    .withFailureHandler(function(e) {
      const container = document.getElementById('tematikPanels');
      if (container) container.innerHTML = '<p class="loading">❌ ' + e.message + '</p>';
    })
    .getTematikPanels(filterState);
}

function reloadMatrik() {
  loadCrossTabAnalisa();
  showToast('🔄 Rekap di-refresh');
}

function loadCrossTabAnalisa() {
  const container = document.getElementById('tabelCrossTab');
  if (!container) return;
  container.innerHTML = '<p class="loading">Memuat data...</p>';
  google.script.run
    .withSuccessHandler(renderCrossTab)
    .withFailureHandler(function(e) {
      container.innerHTML = '<p class="loading">❌ ' + e.message + '</p>';
    })
    .getCrossTabPerGrup(filterState);
}

// =============================================
// PERBANDINGAN — INIT DROPDOWN
// =============================================
function initAnalisaPerbandingan() {
  const selA = document.getElementById('anaPeriodeA');
  if (selA && selA.options.length > 1) return;
  google.script.run.withSuccessHandler(function(list) {
    const selA = document.getElementById('anaPeriodeA');
    const selB = document.getElementById('anaPeriodeB');
    if (!selA || !selB) return;
    selA.innerHTML = '<option value="">— Periode Awal —</option>';
    selB.innerHTML = '<option value="">— Periode Akhir —</option>';
    list.forEach(p => {
      const oA = document.createElement('option');
      oA.value = p.id; oA.textContent = p.label;
      selA.appendChild(oA);
      const oB = document.createElement('option');
      oB.value = p.id; oB.textContent = p.label;
      selB.appendChild(oB);
    });
    if (list.length >= 2) {
      selA.value = list[list.length - 2].id;
      selB.value = list[list.length - 1].id;
    }
  }).getPeriodeListSimple();
}

// =============================================
// PERBANDINGAN — LOAD & RENDER
// =============================================
function loadAnalisa() {
  const periodeA = document.getElementById('anaPeriodeA').value;
  const periodeB = document.getElementById('anaPeriodeB').value;
  const container = document.getElementById('analisaContent');
  if (!periodeA || !periodeB) { showToast('Pilih 2 periode dulu', true); return; }
  if (periodeA === periodeB) { showToast('Pilih periode yang berbeda', true); return; }
  container.innerHTML = '<div class="table-card"><p class="loading">Memuat data...</p></div>';
  google.script.run.withSuccessHandler(function(data) {
    if (data.error) { container.innerHTML = '<div class="table-card"><p class="loading">⚠️ ' + escapeHtml(data.error) + '</p></div>'; return; }
    renderAnalisa(data);
  }).withFailureHandler(function(e) {
    container.innerHTML = '<div class="table-card"><p class="loading">❌ ' + e.message + '</p></div>';
  }).getPerbandingan({ periodeA: periodeA, periodeB: periodeB });
}

function renderAnalisa(data) {
  const container = document.getElementById('analisaContent');
  let html = '';
  const arrowTotal = data.selisihTotal > 0 ? '📈' : data.selisihTotal < 0 ? '📉' : '➡️';
  const colorTotal = data.selisihTotal > 0 ? '#16a34a' : data.selisihTotal < 0 ? '#dc2626' : '#6b7280';
  html += '<div class="analisa-summary">';
  html += '<div class="summary-card"><div class="summary-label">' + escapeHtml(data.periodeA.label) + '</div><div class="summary-value">' + data.totalA + '</div><div class="summary-sub">' + formatRupiah(data.anggaranA) + '</div></div>';
  html += '<div class="summary-arrow">' + arrowTotal + '</div>';
  html += '<div class="summary-card"><div class="summary-label">' + escapeHtml(data.periodeB.label) + '</div><div class="summary-value">' + data.totalB + '</div><div class="summary-sub">' + formatRupiah(data.anggaranB) + '</div></div>';
  html += '<div class="summary-card summary-diff"><div class="summary-label">Selisih</div><div class="summary-value" style="color:' + colorTotal + '">' + (data.selisihTotal > 0 ? '+' : '') + data.selisihTotal + '</div><div class="summary-sub" style="color:' + colorTotal + '">' + (data.persenTotal > 0 ? '+' : '') + data.persenTotal + '%</div></div>';
  html += '</div>';
  html += '<div class="status-summary">';
  html += '<div class="status-pill status-naik">📈 Naik: <strong>' + data.ringkasan.naik + '</strong></div>';
  html += '<div class="status-pill status-turun">📉 Turun: <strong>' + data.ringkasan.turun + '</strong></div>';
  html += '<div class="status-pill status-stabil">➡️ Stabil: <strong>' + data.ringkasan.stabil + '</strong></div>';
  html += '</div>';
  html += '<div class="table-card"><div class="chart-header"><h3>📊 Perbandingan Per Fungsi</h3><span class="badge">BAR</span></div><div style="height: 360px;"><canvas id="chartAnalisa"></canvas></div></div>';
  html += '<div class="table-card"><div class="chart-header"><h3>📋 Detail Perubahan</h3></div><div class="table-wrapper"><table class="table-analisa"><thead><tr><th>Fungsi</th><th style="text-align:center;">' + escapeHtml(data.periodeA.label) + '</th><th style="text-align:center;">' + escapeHtml(data.periodeB.label) + '</th><th style="text-align:center;">Selisih</th><th style="text-align:center;">%</th><th style="text-align:center;">Status</th></tr></thead><tbody>';
  data.diffPerFungsi.forEach(d => {
    const cls = d.status === 'naik' ? 'row-naik' : d.status === 'turun' ? 'row-turun' : '';
    const icon = d.status === 'naik' ? '📈' : d.status === 'turun' ? '📉' : '➡️';
    const sign = d.selisih > 0 ? '+' : '';
    html += '<tr class="' + cls + '"><td><strong>' + escapeHtml(d.fungsi) + '</strong></td><td style="text-align:center;">' + d.nilaiA + '</td><td style="text-align:center;">' + d.nilaiB + '</td><td style="text-align:center;"><strong>' + sign + d.selisih + '</strong></td><td style="text-align:center;">' + sign + d.persen + '%</td><td style="text-align:center;">' + icon + '</td></tr>';
  });
  const signTotal = data.selisihTotal > 0 ? '+' : '';
  html += '<tr style="background:#f8fafc; border-top:2px solid #1e3a5f;"><td><strong>TOTAL</strong></td><td style="text-align:center;"><strong>' + data.totalA + '</strong></td><td style="text-align:center;"><strong>' + data.totalB + '</strong></td><td style="text-align:center;"><strong>' + signTotal + data.selisihTotal + '</strong></td><td style="text-align:center;"><strong>' + signTotal + data.persenTotal + '%</strong></td><td></td></tr>';
  html += '</tbody></table></div></div>';
  container.innerHTML = html;
  setTimeout(() => renderAnalisaChart(data), 100);
}

function renderAnalisaChart(data) {
  const ctx = document.getElementById('chartAnalisa');
  if (!ctx) return;
  if (analisaChart) analisaChart.destroy();
  const labels = data.diffPerFungsi.map(d => d.fungsi);
  const valuesA = data.diffPerFungsi.map(d => d.nilaiA);
  const valuesB = data.diffPerFungsi.map(d => d.nilaiB);
  analisaChart = new Chart(ctx.getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        { label: data.periodeA.label, data: valuesA, backgroundColor: '#94a3b8', borderRadius: 4 },
        { label: data.periodeB.label, data: valuesB, backgroundColor: '#2d5a87', borderRadius: 4 }
      ]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { padding: 12, font: { size: 12 } } } },
      scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  });
}

function exportAnalisaCSV() {
  const container = document.getElementById('analisaContent');
  const table = container.querySelector('.table-analisa');
  if (!table) { showToast('Belum ada data untuk diexport', true); return; }
  const periodeA = document.getElementById('anaPeriodeA');
  const periodeB = document.getElementById('anaPeriodeB');
  const labelA = periodeA.options[periodeA.selectedIndex].text;
  const labelB = periodeB.options[periodeB.selectedIndex].text;
  let csv = 'Analisa Perbandingan\n';
  csv += 'Periode A: ' + labelA + '\n';
  csv += 'Periode B: ' + labelB + '\n\n';
  csv += 'Fungsi;' + labelA + ';' + labelB + ';Selisih;Persen;Status\n';
  const rows = table.querySelectorAll('tbody tr');
  rows.forEach(tr => {
    const cells = tr.querySelectorAll('td');
    if (cells.length >= 6) {
      const row = [];
      cells.forEach(td => { row.push(td.textContent.trim().replace(/;/g, ',')); });
      csv += row.join(';') + '\n';
    }
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Analisa_' + labelA.replace(/\s/g, '') + '_vs_' + labelB.replace(/\s/g, '') + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
