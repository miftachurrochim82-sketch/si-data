<!-- 1. MODAL: FORM KEGIATAN -->
<div id="modalKegiatan" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>➕ Tambah Kegiatan Baru</h3>
      <button class="modal-close" onclick="closeFormKegiatan()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Tanggal *</label><input type="date" id="fTanggal"></div>
        <div class="form-group"><label>Periode *</label><select id="fPeriode"></select></div>
        <!-- CASCADE: Bidang → Seksi → Fungsi -->
        <div class="form-group"><label>Bidang *</label><select id="fBidang"><option value="">— Pilih Bidang —</option></select></div>
        <div class="form-group"><label>Seksi *</label><select id="fSeksi" disabled><option value="">— Pilih Bidang dulu —</option></select></div>
        <div class="form-group full-width"><label>Fungsi *</label><select id="fFungsi" disabled><option value="">— Pilih Seksi dulu —</option></select></div>
        <div class="form-group"><label>Kategori *</label><select id="fKategori"></select></div>
        <div class="form-group"><label>Jenis *</label><select id="fJenis"></select></div>
        <div class="form-group"><label>Lokasi *</label><select id="fLokasi"></select></div>
        <div class="form-group"><label>Satuan *</label><select id="fSatuan"></select></div>
        <div class="form-group full-width"><label>Uraian Kegiatan *</label><input type="text" id="fUraian" placeholder="Contoh: Patroli rutin wilayah kota"></div>
        <div class="form-group"><label>Jumlah / Volume *</label><input type="number" id="fJumlah" min="0" value="0"></div>
        <div class="form-group"><label>Anggaran (Rp)</label><input type="number" id="fAnggaran" min="0" value="0"></div>
        <div class="form-group full-width"><label>Status</label><select id="fStatus"><option value="DRAFT">DRAFT</option><option value="PROSES">PROSES</option><option value="SELESAI" selected>SELESAI</option></select></div>
        <div class="form-group full-width"><label>Keterangan</label><textarea id="fKeterangan" rows="2" placeholder="Opsional"></textarea></div>
      </div>
      <!-- SECTION TEMATIK (dinamis, muncul sesuai fungsi) -->
      <div id="formTematikSection" class="form-tematik-section" style="display:none;">
        <div class="form-tematik-header">
          <span class="form-tematik-icon">📋</span>
          <span class="form-tematik-title">Data Tematik</span>
          <span class="form-tematik-badge">Opsional</span>
        </div>
        <div id="formTematikBody" class="form-tematik-body"></div>
      </div>
      <div id="formError" class="form-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFormKegiatan()">Batal</button>
      <button class="btn" id="btnSimpan" onclick="submitKegiatan()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- 2. MODAL: DETAIL KEGIATAN -->
<div id="modalDetail" class="modal-overlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <h3 id="detailTitle">📄 Detail Kegiatan</h3>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detailBody"><p class="loading">Memuat...</p></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeDetail()">Tutup</button>
      <button class="btn" id="btnEditFromDetail" onclick="editFromDetail()" style="display:none;">✏️ Edit Kegiatan</button>
    </div>
  </div>
</div>

<!-- 3. MODAL: FORM LOGBOOK -->
<div id="modalLogbook" class="modal-overlay">
  <div class="modal modal-sm">
    <div class="modal-header"><h3>➕ Tambah Logbook</h3><button class="modal-close" onclick="closeFormLogbook()">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Tanggal *</label><input type="date" id="lbTanggal"></div>
        <div class="form-group"><label>Pegawai *</label><select id="lbPegawai"><option value="">— Pilih Pegawai —</option></select></div>
        <div class="form-group full-width"><label>Kegiatan (opsional)</label><select id="lbKegiatan"><option value="">— Tidak terikat kegiatan —</option></select></div>
        <div class="form-group full-width"><label>Uraian *</label><textarea id="lbUraian" rows="3" placeholder="Contoh: Patroli malam dari pukul 22.00-02.00"></textarea></div>
      </div>
      <div id="lbError" class="form-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFormLogbook()">Batal</button>
      <button class="btn" id="btnSimpanLogbook" onclick="submitLogbook()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- 4. MODAL: FORM PESERTA -->
<div id="modalPeserta" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3>➕ Tambah Peserta Kegiatan</h3><button class="modal-close" onclick="closeFormPeserta()">✕</button></div>
    <div class="modal-body">
      <div class="form-group full-width mb-14"><label>Kegiatan *</label><select id="psKegiatan"><option value="">— Pilih Kegiatan —</option></select></div>
      <div class="form-group full-width"><label>Tambah Pegawai</label>
        <div class="inline-flex-gap">
          <select id="psPegawai" class="flex-1"><option value="">— Pilih Pegawai —</option></select>
          <select id="psPeran" style="width: 140px;">
            <option value="Koordinator">Koordinator</option>
            <option value="Anggota" selected>Anggota</option>
            <option value="Pengawas">Pengawas</option>
            <option value="Pendamping">Pendamping</option>
          </select>
          <button class="btn" onclick="addPesertaToList()">➕</button>
        </div>
      </div>
      <div id="psList" class="peserta-temp-list"><p class="loading">Belum ada peserta ditambahkan.</p></div>
      <div id="psError" class="form-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFormPeserta()">Batal</button>
      <button class="btn" id="btnSimpanPeserta" onclick="submitPeserta()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- 5. MODAL: FORM TARGET -->
<div id="modalTarget" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTargetTitle">➕ Tambah Target</h3><button class="modal-close" onclick="closeFormTarget()">✕</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full-width"><label>Nama Target *</label><input type="text" id="tNama" placeholder="Contoh: Target Patroli Januari 2026"></div>
        <div class="form-group"><label>Fungsi *</label><select id="tFungsi"></select></div>
        <div class="form-group"><label>Periode *</label><select id="tPeriode"></select></div>
        <div class="form-group"><label>Unit Kerja *</label><select id="tUnit"></select></div>
        <div class="form-group"><label>Target Kegiatan *</label><input type="number" id="tKegiatan" min="0" value="0"></div>
        <div class="form-group"><label>Target Anggaran (Rp)</label><input type="number" id="tAnggaran" min="0" value="0"></div>
        <div class="form-group"><label>Target Volume</label><input type="number" id="tVolume" min="0" value="0"></div>
        <div class="form-group full-width"><label>Keterangan</label><textarea id="tKeterangan" rows="2"></textarea></div>
      </div>
      <div id="targetError" class="form-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFormTarget()">Batal</button>
      <button class="btn" id="btnSimpanTarget" onclick="submitTarget()">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- 6. MODAL: UPLOAD LAMPIRAN -->
<div id="modalUpload" class="modal-overlay">
  <div class="modal modal-sm">
    <div class="modal-header"><h3>📎 Upload Lampiran</h3><button class="modal-close" onclick="closeFormUpload()">✕</button></div>
    <div class="modal-body">
      <div class="form-group full-width mb-14"><label>Kegiatan *</label><select id="upKegiatan"><option value="">— Pilih Kegiatan —</option></select></div>
      <div class="form-group full-width mb-14">
        <label>File * <small class="text-muted">(maks 5 MB)</small></label>
        <div class="file-drop-zone" id="upDropZone">
          <input type="file" id="upFile" style="display:none;" onchange="onFileSelected(this)">
          <div class="file-drop-content" onclick="document.getElementById('upFile').click()">
            <div class="file-drop-icon">📁</div>
            <div class="file-drop-text"><strong>Klik untuk pilih file</strong><br><small>PDF, Word, Excel, Gambar, dll</small></div>
          </div>
          <div id="upFileInfo" class="file-info" style="display:none;"></div>
        </div>
      </div>
      <div class="form-group full-width mb-14"><label>Nama Dokumen</label><input type="text" id="upNama" placeholder="Otomatis dari nama file"></div>
      <div class="form-group full-width"><label>Deskripsi</label><textarea id="upDeskripsi" rows="2" placeholder="Opsional — catatan tentang file ini"></textarea></div>
      <div class="upload-progress" id="upProgress" style="display:none;"><div class="upload-progress-bar" id="upProgressBar"></div></div>
      <div id="upError" class="form-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeFormUpload()">Batal</button>
      <button class="btn" id="btnUpload" onclick="submitUpload()">📤 Upload</button>
    </div>
  </div>
</div>
